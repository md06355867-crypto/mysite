let current=0;

const storyList=document.getElementById("storyList");

stories.forEach((s,i)=>{
let div=document.createElement("div");
div.className="story";
div.innerText=s.title;
div.onclick=()=>showStory(i);
storyList.appendChild(div);
});

function showStory(id){
current=id;
document.querySelectorAll(".story").forEach(s=>s.classList.remove("active"));
document.querySelectorAll(".story")[id].classList.add("active");
document.getElementById("content").innerText=stories[id].text;
}

function nextStory(){
if(current<stories.length-1) current++;
showStory(current);
}

function prevStory(){
if(current>0) current--;
showStory(current);
}

function toggleMode(){
document.body.classList.toggle("light");
}

showStory(0);
